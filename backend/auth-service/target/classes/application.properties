spring.application.name=auth-service
server.port=8081

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/AmazonDBDB}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

auth.jwt.secret=${JWT_SECRET:changeme-changeme-changeme-changeme-32chars}
auth.jwt.issuer=amazon-auth-service
auth.jwt.access-token-minutes=60
auth.jwt.refresh-token-days=7

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://eureka:eureka@localhost:8761/eureka/,http://eureka:eureka@localhost:8762/eureka/
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}
