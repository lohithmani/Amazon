spring.application.name=api-gateway
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

server.port=8080

auth.jwt.secret=${JWT_SECRET:changeme-changeme-changeme-changeme-32chars}
auth.public-paths=/api/auth/register,/api/auth/login,/api/auth/refresh,/api/auth/password/reset-request,/api/auth/password/reset,/api/products,/actuator/health

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://eureka:eureka@localhost:8761/eureka/,http://eureka:eureka@localhost:8762/eureka/
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}

management.endpoints.web.exposure.include=health,info
