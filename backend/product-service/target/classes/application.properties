spring.application.name=product-service
server.port=8083

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/AmazonDB}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

products.seed.enabled=${PRODUCT_SEED_ENABLED:true}
products.seed.source-url=${PRODUCT_SEED_SOURCE_URL:https://dummyjson.com/products?limit=100}

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://eureka:eureka@localhost:8761/eureka/,http://eureka:eureka@localhost:8762/eureka/
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}
